<!DOCTYPE html>

    .btn-secondary,
    .btn-secondary:hover,

    body {

    }

    .text-center {

    .mastfoot {

    nav,

    const modulo = "mifoo-api";
    const version = 2;

    document.getElementById("st-ms").innerText = modulo;

    document.getElementById("link-icon-3").setAttribute("href", imageLogo);
    document.getElementById("img-logo").setAttribute("src", imageLogo);
